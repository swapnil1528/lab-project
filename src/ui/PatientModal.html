<!-- Patient Registration & Demographic Modal with DPDP Act 2023 Consent -->
<div id="patient-modal" class="modal-backdrop fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-slate-200">
    
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50 rounded-t-xl">
      <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span data-i18n="registerPatient">Patient Registration</span>
      </h3>
      <button onclick="closeAllModals()" class="text-slate-400 hover:text-slate-600 p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Duplicate Alert Warning Box -->
    <div id="duplicate-warning-box" class="hidden m-6 p-4 bg-amber-50 border border-amber-200 rounded-lg">
      <div class="flex items-start gap-3">
        <svg class="w-5 h-5 text-amber-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <div>
          <h4 class="text-sm font-bold text-amber-900">Potential Duplicate Patient Detected</h4>
          <p id="duplicate-warning-msg" class="text-xs text-amber-700 mt-1"></p>
          <div id="duplicate-candidates-list" class="mt-2 text-xs text-slate-700 space-y-1"></div>
          <div class="mt-3 flex gap-2">
            <button onclick="forceRegisterPatient()" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold">Proceed As New Patient</button>
            <button onclick="closeAllModals()" class="px-3 py-1.5 border border-slate-300 text-slate-700 rounded text-xs">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Registration Form -->
    <form id="patient-registration-form" onsubmit="submitPatientForm(event)" class="p-6 space-y-4">
      
      <!-- Row 1: Title, First Name, Last Name -->
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Title *</label>
          <select id="pat-title" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="Mr">Mr</option>
            <option value="Mrs">Mrs</option>
            <option value="Ms">Ms</option>
            <option value="Master">Master</option>
            <option value="Baby">Baby</option>
            <option value="Dr">Dr</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1">First Name *</label>
          <input type="text" id="pat-first-name" required placeholder="e.g. Ramesh"
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Last Name</label>
          <input type="text" id="pat-last-name" placeholder="e.g. Sharma"
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Row 2: Gender, Age, Age Unit, DOB -->
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Gender *</label>
          <select id="pat-gender" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Age *</label>
          <input type="number" id="pat-age" required min="0" max="130" placeholder="e.g. 35"
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Unit</label>
          <select id="pat-age-unit" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="Years">Years</option>
            <option value="Months">Months</option>
            <option value="Days">Days</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">DOB (Optional)</label>
          <input type="date" id="pat-dob"
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Row 3: Mobile & Email -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">10-Digit Mobile Number *</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs font-bold">+91</span>
            <input type="tel" id="pat-mobile" required pattern="[6-9][0-9]{9}" placeholder="9820012345"
              class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-10 pr-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email (for Report PDF)</label>
          <input type="email" id="pat-email" placeholder="patient@example.com"
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Row 4: Blood Group & Address -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Blood Group</label>
          <select id="pat-blood-group" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="Unknown">Unknown</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-700 mb-1">City / Locality</label>
          <input type="text" id="pat-city" value="Mumbai"
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Row 5: DPDP Act 2023 Explicit Digital Consent -->
      <div class="bg-blue-50/60 border border-blue-200 rounded-lg p-3">
        <label class="flex items-start gap-2.5 cursor-pointer">
          <input type="checkbox" id="pat-dpdp-consent" required checked
            class="mt-1 w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
          <span class="text-xs text-slate-700 leading-relaxed" data-i18n="dpdpConsent">
            <strong>DPDP Act 2023 Consent:</strong> Patient explicitly authorizes Arogya Diagnostic Laboratory to process health diagnostic specimens and data for the sole purpose of diagnostic testing and digital report delivery.
          </span>
        </label>
      </div>

      <!-- Submit Footer -->
      <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
        <button type="button" onclick="closeAllModals()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm hover:bg-slate-100 transition">Cancel</button>
        <button type="submit" id="pat-submit-btn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-sm transition">Register & Generate UHID</button>
      </div>
    </form>

  </div>
</div>

<script>
  function openPatientModal() {
    document.getElementById('duplicate-warning-box').classList.add('hidden');
    document.getElementById('patient-modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('pat-first-name').focus(), 100);
  }

  function submitPatientForm(e) {
    e.preventDefault();
    const payload = {
      title: document.getElementById('pat-title').value,
      first_name: document.getElementById('pat-first-name').value,
      last_name: document.getElementById('pat-last-name').value,
      gender: document.getElementById('pat-gender').value,
      age: document.getElementById('pat-age').value,
      age_unit: document.getElementById('pat-age-unit').value,
      dob: document.getElementById('pat-dob').value,
      mobile: document.getElementById('pat-mobile').value,
      email: document.getElementById('pat-email').value,
      blood_group: document.getElementById('pat-blood-group').value,
      city: document.getElementById('pat-city').value,
      consent_dpdp: document.getElementById('pat-dpdp-consent').checked
    };

    const submitBtn = document.getElementById('pat-submit-btn');
    submitBtn.innerText = 'Registering...';
    submitBtn.disabled = true;

    google.script.run
      .withSuccessHandler((res) => {
        submitBtn.innerText = 'Register & Generate UHID';
        submitBtn.disabled = false;

        if (res.duplicateDetected) {
          document.getElementById('duplicate-warning-msg').innerText = res.message;
          const candList = document.getElementById('duplicate-candidates-list');
          candList.innerHTML = res.duplicates.map(d => `
            <div class="p-1.5 bg-white border border-amber-300 rounded flex justify-between items-center">
              <span><strong>${d.fullName}</strong> (${d.gender}, ${d.age}Y) - UHID: ${d.uhid}</span>
              <button type="button" onclick="selectExistingPatient('${d.uhid}', '${d.fullName}')" class="px-2 py-0.5 bg-blue-600 text-white rounded text-[11px]">Select Existing</button>
            </div>
          `).join('');
          document.getElementById('duplicate-warning-box').classList.remove('hidden');
          return;
        }

        showToast(`Patient registered! UHID: ${res.patient.uhid}`);
        closeAllModals();
        // Load into Order Billing cart
        selectPatientForOrder(res.patient.uhid, `${res.patient.first_name} ${res.patient.last_name || ''}`);
      })
      .withFailureHandler((err) => {
        submitBtn.innerText = 'Register & Generate UHID';
        submitBtn.disabled = false;
        showToast(err.message, 'error');
      })
      .apiRegisterPatient(payload, false);
  }

  function forceRegisterPatient() {
    const payload = {
      title: document.getElementById('pat-title').value,
      first_name: document.getElementById('pat-first-name').value,
      last_name: document.getElementById('pat-last-name').value,
      gender: document.getElementById('pat-gender').value,
      age: document.getElementById('pat-age').value,
      age_unit: document.getElementById('pat-age-unit').value,
      dob: document.getElementById('pat-dob').value,
      mobile: document.getElementById('pat-mobile').value,
      email: document.getElementById('pat-email').value,
      blood_group: document.getElementById('pat-blood-group').value,
      city: document.getElementById('pat-city').value,
      consent_dpdp: document.getElementById('pat-dpdp-consent').checked
    };

    google.script.run
      .withSuccessHandler((res) => {
        showToast(`Patient registered! UHID: ${res.patient.uhid}`);
        closeAllModals();
        selectPatientForOrder(res.patient.uhid, `${res.patient.first_name} ${res.patient.last_name || ''}`);
      })
      .withFailureHandler((err) => showToast(err.message, 'error'))
      .apiRegisterPatient(payload, true);
  }

  function selectExistingPatient(uhid, name) {
    closeAllModals();
    selectPatientForOrder(uhid, name);
  }
</script>
