<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Masterprick Clinical Laboratory - Laboratory Information System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-panic {
      animation: pulse-subtle 1.2s infinite;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media print {
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzP6tlEBmrZQRw4GnqEl8iGSSNByteMTdJtvvGpE9Aa5t4nDPO5_qziwr3h5WsVeTg/exec';

    // =========================================================================
    // UNIVERSAL API CLIENT (Google Apps Script + Local Dev Server Bridge)
    // =========================================================================
    const api = {
      async call(action, ...args) {
        // 1. In Google Apps Script environment, use native google.script.run
        if (window.google && window.google.script && window.google.script.run) {
          return new Promise((resolve, reject) => {
            const runner = window.google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject);
            const gasMethod = 'api' + action.charAt(0).toUpperCase() + action.slice(1);
            if (typeof runner[gasMethod] === 'function') {
              runner[gasMethod].apply(runner, args);
            } else if (typeof runner[action] === 'function') {
              runner[action].apply(runner, args);
            } else {
              // Direct HTTP fallback
              this._postDirect(action, args).then(resolve).catch(reject);
            }
          });
        }

        // 2. In Local Development Server, proxy to /api/:method
        try {
          const res = await fetch('/api/' + (action.startsWith('api') ? action : 'api' + action.charAt(0).toUpperCase() + action.slice(1)), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ args })
          });
          const data = await res.json();
          if (data && data.result !== undefined) return data.result;
          if (data && data.error) throw new Error(data.error);
          return data;
        } catch (err) {
          // 3. Fallback to direct cloud Google Apps Script Web App
          return this._postDirect(action, args);
        }
      },

      async _postDirect(action, args) {
        const gasAction = action.startsWith('api') ? action.slice(3, 4).toLowerCase() + action.slice(4) : action;
        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: gasAction, args: args }),
          redirect: 'follow'
        });
        const json = await resp.json();
        if (json.success === false) throw new Error(json.error || 'Server request failed');
        return json.result;
      }
    };

    // =========================================================================
    // SVG ICONS COMPONENT LIBRARY
    // =========================================================================
    const Icons = {
      Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      User: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Barcode: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>,
      Printer: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>,
      Share: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>,
      Flask: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>,
      AlertCircle: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Close: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      Document: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
      WhatsApp: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>,
      Mail: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    };

    // Helper to normalize patient data structure across search and registration
    function normalizePatient(p) {
      if (!p) return null;
      const raw = p.patient || p;
      const fName = raw.first_name || raw.firstName || '';
      const lName = raw.last_name || raw.lastName || '';
      const title = raw.title || '';
      const full = raw.fullName || `${title ? title + ' ' : ''}${fName} ${lName}`.trim();
      return {
        ...raw,
        id: raw.id,
        uhid: raw.uhid,
        title: title,
        first_name: fName,
        last_name: lName,
        fullName: full,
        age: raw.age || 0,
        age_unit: raw.age_unit || raw.ageUnit || 'Years',
        gender: raw.gender || 'Unknown',
        mobile: raw.mobile || '',
        email: raw.email || '',
        city: raw.city || ''
      };
    }

    // =========================================================================
    // MAIN REACT APPLICATION
    // =========================================================================
    function App() {
      // 1. Application Global State
      const [context, setContext] = useState({
        authenticated: true,
        email: 'admin@masterprick.in',
        role: 'Admin',
        labProfile: {
          name: 'Masterprick Clinical Laboratory',
          address: 'DEVICHAPADA',
          phone: '+91 98200 12345'
        }
      });

      const [activeTab, setActiveTab] = useState('orders'); // 'dashboard', 'orders', 'phlebotomy', 'results', 'reports', 'inventory', 'admin'
      const [catalog, setCatalog] = useState([]);
      const [patientsList, setPatientsList] = useState([]);
      const [selectedPatient, setSelectedPatient] = useState(null);
      const [cart, setCart] = useState([]);
      const [toasts, setToasts] = useState([]);
      
      // Modals
      const [isPatientModalOpen, setIsPatientModalOpen] = useState(false);
      const [isInvoiceModalOpen, setIsInvoiceModalOpen] = useState(false);
      const [latestInvoice, setLatestInvoice] = useState(null);

      // Phlebotomy & Result Entry States
      const [phlebotomyQueue, setPhlebotomyQueue] = useState([]);
      const [resultWorklist, setResultWorklist] = useState([]);
      const [resultDept, setResultDept] = useState('');
      const [isLoadingWorklist, setIsLoadingWorklist] = useState(false);
      const [isLoadingResultParams, setIsLoadingResultParams] = useState(false);
      const [activeResultOrder, setActiveResultOrder] = useState(null);
      const [activeResultParameters, setActiveResultParameters] = useState([]);
      const [resultValues, setResultValues] = useState({});

      // Reports & Dispatch States
      const [reportsList, setReportsList] = useState([]);
      const [selectedReportOrder, setSelectedReportOrder] = useState(null);
      const [compiledReportData, setCompiledReportData] = useState(null);
      const [reportFilter, setReportFilter] = useState('All');

      // Inventory & Admin Doctors States
      const [inventoryList, setInventoryList] = useState([]);
      const [doctorsList, setDoctorsList] = useState([
        { id: 'DOC-SELF', code: 'DOC-SELF', name: 'Self / Direct Walk-in', degree: '', specialization: 'General Consultation', clinic_hospital: 'Walk-in Desk', mobile: '', email: '', commission_rate: 0, status: 'Active' }
      ]);
      const [isDoctorModalOpen, setIsDoctorModalOpen] = useState(false);
      const [editingDoctor, setEditingDoctor] = useState(null);
      const [doctorForm, setDoctorForm] = useState({
        name: '', degree: '', specialization: '', clinic_hospital: '', mobile: '', email: '', commission_rate: ''
      });

      // Admin Catalog Pricing States
      const [priceSearch, setPriceSearch] = useState('');
      const [priceTypeFilter, setPriceTypeFilter] = useState('All'); // 'All', 'Panel', 'Test'
      const [priceEdits, setPriceEdits] = useState({});
      const [savingPriceId, setSavingPriceId] = useState(null);

      // Toast notification helper
      const showToast = useCallback((message, type = 'success') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      }, []);

      // 2. Initial Data Loading from Google Sheet Backend
      useEffect(() => {
        async function initApp() {
          try {
            // Load lab session context and brand profile
            const ctx = await api.call('getContext');
            if (ctx && ctx.labProfile && ctx.labProfile.name) {
              setContext(ctx);
            }
          } catch (e) {
            console.warn('Using default context:', e);
          }

          // Load clinical test catalog
          await refreshCatalog();

          // Initial Phlebotomy Queue & Referring Doctors fetch
          refreshPhlebotomy();
          refreshDoctors();
        }

        initApp();
      }, []);

      // Refresh diagnostic test & panel catalog
      const refreshCatalog = async () => {
        try {
          const cat = await api.call('getCatalog');
          if (cat && (cat.tests || cat.panels)) {
            const fullCatalog = [
              ...(cat.panels || []).map(p => ({ ...p, isPanel: true })),
              ...(cat.tests || []).map(t => ({ ...t, isPanel: false }))
            ];
            setCatalog(fullCatalog);
            setPriceEdits({});
          }
        } catch (e) {
          console.error('Catalog fetch error:', e);
        }
      };

      // Refresh referring doctors list
      const refreshDoctors = async () => {
        try {
          const list = await api.call('getDoctorsList', false);
          if (Array.isArray(list) && list.length > 0) setDoctorsList(list);
        } catch (e) {}
      };

      // Refresh phlebotomy worklist
      const refreshPhlebotomy = async () => {
        try {
          const list = await api.call('getPhlebotomyWorklist', '');
          if (Array.isArray(list)) setPhlebotomyQueue(list);
        } catch (e) {}
      };

      // Refresh results worklist (defaults to All Departments)
      const refreshResults = async (dept = resultDept) => {
        setIsLoadingWorklist(true);
        try {
          const targetDept = dept !== undefined ? dept : '';
          setResultDept(targetDept);
          const list = await api.call('getDepartmentWorklist', targetDept);
          if (Array.isArray(list)) {
            setResultWorklist(list);
          } else {
            setResultWorklist([]);
          }
        } catch (e) {
          console.error('Results worklist fetch error:', e);
          showToast(e.message || 'Failed to load result entry worklist', 'error');
        } finally {
          setIsLoadingWorklist(false);
        }
      };

      // Refresh reports list
      const refreshReports = async (status = '') => {
        try {
          let list = [];
          try {
            const ordRes = await api.call('getOrdersList', status === 'All' ? '' : status);
            if (Array.isArray(ordRes)) list = ordRes;
          } catch (innerErr) {
            console.warn('getOrdersList unavailable on remote, falling back to worklist:', innerErr.message);
          }
          if (!Array.isArray(list) || list.length === 0) {
            const wl = await api.call('getDepartmentWorklist', '');
            if (Array.isArray(wl)) {
              list = wl.map(w => ({
                id: w.orderId,
                order_id: w.orderId,
                order_no: w.orderNo,
                patient_name: w.patientName,
                uhid: w.uhid,
                order_status: w.status === 'Validated' ? 'Validated' : (w.resultCount > 0 ? 'Resulted' : 'Booked')
              }));
            }
          }
          if (Array.isArray(list)) {
            setReportsList(list);
            if (list.length > 0 && !selectedReportOrder) {
              const firstOrd = list[0];
              setSelectedReportOrder(firstOrd);
              loadReportPreview(firstOrd.id || firstOrd.order_id || firstOrd.orderId);
            }
          }
        } catch (e) {
          console.error('Reports fetch error:', e);
        }
      };

      // Load individual report preview
      const loadReportPreview = async (orderId) => {
        try {
          const data = await api.call('compileReportData', orderId);
          setCompiledReportData(data);
        } catch (e) {
          console.error('Report compilation error:', e);
        }
      };

      // Refresh inventory
      const refreshInventory = async () => {
        try {
          const list = await api.call('getInventoryList');
          if (Array.isArray(list)) setInventoryList(list);
        } catch (e) {}
      };

      // 3. Billing Cart Calculations (Live Reactive Computation)
      const [discountVal, setDiscountVal] = useState(0);
      const [tenderMode, setTenderMode] = useState('UPI / QR Code');
      const [amountPaid, setAmountPaid] = useState('');
      const [referringDoctor, setReferringDoctor] = useState('DOC-SELF');

      const grossTotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + (parseFloat(item.price) || 0), 0);
      }, [cart]);

      const discountAmount = useMemo(() => {
        const d = parseFloat(discountVal) || 0;
        return Math.min(grossTotal, Math.max(0, d));
      }, [grossTotal, discountVal]);

      const netBillable = useMemo(() => {
        return Math.max(0, grossTotal - discountAmount);
      }, [grossTotal, discountAmount]);

      // Auto-default amount paid to net billable for seamless front-desk checkout
      useEffect(() => {
        setAmountPaid(String(netBillable));
      }, [netBillable]);

      const balanceDue = useMemo(() => {
        const paid = parseFloat(amountPaid) || 0;
        return Math.max(0, netBillable - paid);
      }, [netBillable, amountPaid]);

      // Add to cart helper
      const addToCart = (item) => {
        if (cart.find(c => c.id === item.id)) {
          showToast(`${item.name} is already in the cart`, 'warning');
          return;
        }
        setCart(prev => [...prev, item]);
        showToast(`Added ${item.name} (₹${item.price}) to cart`);
      };

      // Remove from cart
      const removeFromCart = (id) => {
        setCart(prev => prev.filter(c => c.id !== id));
      };

      // Book Order Handler
      const handleBookOrder = async () => {
        if (!selectedPatient || !selectedPatient.uhid) {
          showToast('Please select or register a valid patient first', 'error');
          setIsPatientModalOpen(true);
          return;
        }
        if (cart.length === 0) {
          showToast('Please select at least one test or panel', 'warning');
          return;
        }

        try {
          showToast('Booking order and saving to Google Sheet...', 'info');
          const orderPayload = {
            uhid: selectedPatient.uhid,
            referring_doctor_id: referringDoctor,
            referringDoctor: referringDoctor,
            collectionCentreId: 'CENTRE-MAIN',
            items: cart.map(i => ({
              id: i.id,
              testId: i.id,
              code: i.code || i.id,
              type: i.isPanel ? 'Panel' : 'Test',
              isPanel: !!i.isPanel,
              price: parseFloat(i.price) || 0
            })),
            discount: { amount: discountAmount, reason: 'Front desk concession' },
            payment: {
              amount: parseFloat(amountPaid) || 0,
              mode: tenderMode,
              payment_method: tenderMode
            },
            initial_payment: {
              amount: parseFloat(amountPaid) || 0,
              mode: tenderMode,
              payment_method: tenderMode
            }
          };

          const orderRes = await api.call('createOrder', orderPayload);
          const normalizedInvoice = {
            invoiceNo: (orderRes.invoice && (orderRes.invoice.invoice_no || orderRes.invoice.invoiceNo)) || orderRes.invoiceNo || 'INV-SUCCESS',
            orderNo: (orderRes.order && (orderRes.order.order_no || orderRes.order.orderNo)) || orderRes.orderNo || 'ORD-SUCCESS',
            uhid: (orderRes.order && orderRes.order.uhid) || (orderRes.invoice && orderRes.invoice.uhid) || orderPayload.uhid,
            netAmount: (orderRes.invoice && (orderRes.invoice.net_amount !== undefined ? orderRes.invoice.net_amount : orderRes.invoice.netAmount)) || orderRes.netAmount || 0,
            paidAmount: (orderRes.invoice && (orderRes.invoice.paid_amount !== undefined ? orderRes.invoice.paid_amount : orderRes.invoice.paidAmount)) || orderRes.paidAmount || (orderPayload.payment ? orderPayload.payment.amount : 0),
            balanceAmount: (orderRes.invoice && (orderRes.invoice.balance_amount !== undefined ? orderRes.invoice.balance_amount : orderRes.invoice.balanceAmount)) || orderRes.balanceAmount || 0
          };
          setLatestInvoice(normalizedInvoice);
          setIsInvoiceModalOpen(true);
          setCart([]);
          setDiscountVal(0);
          setAmountPaid('');
          showToast(`Order ${normalizedInvoice.orderNo} booked! Invoice: ${normalizedInvoice.invoiceNo}`, 'success');
          refreshPhlebotomy();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // Tube color styling dictionary
      const getTubeBadge = (specimen) => {
        const spec = String(specimen || '').toLowerCase();
        if (spec.includes('edta') || spec.includes('whole blood')) {
          return { name: 'EDTA (Lavender)', bg: 'bg-purple-100 text-purple-800 border-purple-300' };
        }
        if (spec.includes('serum') || spec.includes('clot') || spec.includes('sst')) {
          return { name: 'SST (Gold / Red)', bg: 'bg-amber-100 text-amber-800 border-amber-300' };
        }
        if (spec.includes('fluoride') || spec.includes('glucose')) {
          return { name: 'Fluoride (Grey)', bg: 'bg-slate-200 text-slate-800 border-slate-400' };
        }
        return { name: specimen || 'Tube', bg: 'bg-blue-100 text-blue-800 border-blue-300' };
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* ==================== 1. BRAND HEADER & NAV ==================== */}
          <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                {/* Brand Identity */}
                <div className="flex items-center gap-3">

            </div>
          )}

          {/* ==================== 4B. ADD / EDIT DOCTOR MODAL ==================== */}
          {isDoctorModalOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full overflow-hidden">
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <h3 className="font-extrabold text-sm flex items-center gap-2">
                    <Icons.User />
                    <span>{editingDoctor ? 'Edit Referring Doctor' : 'Add New Referring Doctor'}</span>
                  </h3>
                  <button onClick={() => setIsDoctorModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <Icons.Close />
                  </button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    if (!doctorForm.name.trim()) {
                      showToast('Doctor name is required', 'error');
                      return;
                    }
                    try {
                      const payload = {
                        ...(editingDoctor ? { id: editingDoctor.id, code: editingDoctor.code } : {}),
                        name: doctorForm.name.trim(),
                        degree: doctorForm.degree.trim(),
                        specialization: doctorForm.specialization.trim(),
                        clinic_hospital: doctorForm.clinic_hospital.trim(),
                        mobile: doctorForm.mobile.trim(),
                        email: doctorForm.email.trim(),
                        commission_rate: parseFloat(doctorForm.commission_rate) || 0
                      };
                      const res = await api.call('saveDoctor', payload);
                      showToast((res && res.message) || 'Doctor saved successfully!', 'success');
                      setIsDoctorModalOpen(false);
                      setEditingDoctor(null);
                      refreshDoctors();
                    } catch (err) {
                      showToast(err.message || 'Failed to save doctor', 'error');
                    }
                  }}
                  className="p-6 space-y-4 text-xs"
                >
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="sm:col-span-2">
                      <label className="font-bold text-slate-600 block mb-1">Doctor Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Dr. Rajesh Sharma"
                        value={doctorForm.name}
                        onChange={(e) => setDoctorForm(prev => ({ ...prev, name: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:bg-white focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Degree / Qualification</label>
                      <input
                        type="text"
                        placeholder="e.g. MBBS, MD (Med)"
                        value={doctorForm.degree}
                        onChange={(e) => setDoctorForm(prev => ({ ...prev, degree: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:bg-white focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Specialization</label>
                      <input
                        type="text"
                        placeholder="e.g. Internal Medicine"
                        value={doctorForm.specialization}
                        onChange={(e) => setDoctorForm(prev => ({ ...prev, specialization: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:bg-white focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="font-bold text-slate-600 block mb-1">Clinic / Hospital</label>
                      <input
                        type="text"
                        placeholder="e.g. Sharma Polyclinic, Devichapada"
                        value={doctorForm.clinic_hospital}
                        onChange={(e) => setDoctorForm(prev => ({ ...prev, clinic_hospital: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:bg-white focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Mobile</label>
                      <input
                        type="tel"
                        placeholder="10-digit mobile"
                        value={doctorForm.mobile}
                        onChange={(e) => setDoctorForm(prev => ({ ...prev, mobile: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 font-mono focus:bg-white focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Commission Rate (%)</label>
                      <input
                        type="number"
                        min="0"
                        max="100"
                        step="0.5"
                        placeholder="0"
                        value={doctorForm.commission_rate}
                        onChange={(e) => setDoctorForm(prev => ({ ...prev, commission_rate: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 font-mono focus:bg-white focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="font-bold text-slate-600 block mb-1">Email</label>
                      <input
                        type="email"
                        placeholder="doctor@clinic.com"
                        value={doctorForm.email}
                        onChange={(e) => setDoctorForm(prev => ({ ...prev, email: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 focus:bg-white focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsDoctorModalOpen(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-lg shadow-sm transition"
                    >
                      {editingDoctor ? 'Save Changes' : 'Add Doctor'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==================== 5. TOAST NOTIFICATIONS ==================== */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-2 pointer-events-none">
            {toasts.map(t => (
              <div 
                key={t.id} 
                className={`px-4 py-2.5 rounded-xl shadow-lg border text-xs font-bold pointer-events-auto transition flex items-center gap-2 ${
                  t.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' :
                  t.type === 'warning' ? 'bg-amber-50 text-amber-800 border-amber-200' :
                  t.type === 'info' ? 'bg-blue-50 text-blue-800 border-blue-200' :
                  'bg-emerald-50 text-emerald-800 border-emerald-200'
                }`}
              >
                <span>{t.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
