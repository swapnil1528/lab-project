<!-- Orders & Billing Front-Desk Workspace -->
<div id="tab-orders" class="tab-content hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
  
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Left Column: Test & Panel Catalog Browser (2 cols) -->
    <div class="lg:col-span-2 space-y-4">
      
      <!-- Patient Banner / Selection -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          <div>
            <div id="selected-patient-name" class="font-bold text-slate-900 text-sm">No Patient Selected</div>
            <div id="selected-patient-uhid" class="text-xs text-slate-500 font-mono">Click 'New Patient' or search above</div>
          </div>
        </div>
        <button onclick="openPatientModal()" class="text-xs font-semibold text-blue-600 hover:text-blue-800 border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50">
          Change Patient
        </button>
      </div>

      <!-- Test Catalog Search & Quick Filter Pills -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">Test & Package Catalog</h2>
          <span class="text-xs text-slate-400">Click item to add to bill</span>
        </div>

        <input type="text" id="catalog-search-input"
          class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
          placeholder="Filter tests by name (e.g. CBC, Lipid, Thyroid, Glucose)..."
          oninput="filterCatalogDisplay(this.value)">

        <!-- Department Pills -->
        <div class="flex flex-wrap gap-1.5 pt-1" id="dept-filter-pills">
          <button onclick="filterDept('All')" class="dept-pill px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-600 text-white">All</button>
          <button onclick="filterDept('Hematology')" class="dept-pill px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Hematology</button>
          <button onclick="filterDept('Biochemistry')" class="dept-pill px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Biochemistry</button>
          <button onclick="filterDept('Immunology')" class="dept-pill px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Immunology</button>
        </div>

        <!-- Catalog Grid Cards -->
        <div id="catalog-items-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-96 overflow-y-auto pt-2">
          <!-- Populated by JS -->
        </div>
      </div>

    </div>

    <!-- Right Column: Billing Cart & Invoicing (1 col) -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4 flex flex-col justify-between">
      
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-200">
          <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            Order Cart & Billing
          </h3>
          <span id="cart-item-count" class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">0 Items</span>
        </div>

        <!-- Selected Cart Items List -->
        <div id="cart-items-container" class="divide-y divide-slate-100 max-h-56 overflow-y-auto my-3 text-sm">
          <div class="text-center py-8 text-slate-400 text-xs">No tests added yet.<br>Select from the catalog.</div>
        </div>

        <!-- Doctor & Centre Tariff Details -->
        <div class="space-y-2.5 pt-3 border-t border-slate-200 text-xs">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Referring Doctor</label>
            <select id="order-doctor-select" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs">
              <option value="DOC-SELF">Self / Walk-in</option>
              <option value="DOC-SHARMA">Dr. Rajesh Sharma (MD Med)</option>
              <option value="DOC-PATEL">Dr. Sneha Patel (DGO)</option>
              <option value="DOC-KHAN">Dr. Tariq Khan (MS Surg)</option>
            </select>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Collection Centre / Rate Tier</label>
            <select id="order-centre-select" onchange="handleCentreChange()" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs">
              <option value="CTR-MAIN">Main Lab (Standard Retail Rates)</option>
              <option value="CTR-BORIVALI">Borivali Centre (B2B Tier 1)</option>
              <option value="CTR-BANDRA">Bandra Annex (B2B Tier 2)</option>
            </select>
          </div>

          <!-- Discount Management -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Discount (INR)</label>
              <input type="number" id="order-discount-amt" value="0" min="0" oninput="updateCartTotals()"
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Authorizer Email</label>
              <input type="email" id="order-discount-auth" placeholder="admin@..."
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs">
            </div>
          </div>
        </div>
      </div>

      <!-- Financial Totals Box -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 text-xs">
        <div class="flex justify-between text-slate-600">
          <span>Gross Total:</span>
          <span id="bill-gross-total" class="font-semibold">₹0.00</span>
        </div>
        <div class="flex justify-between text-emerald-600">
          <span>Concession / Discount:</span>
          <span id="bill-discount-total">-₹0.00</span>
        </div>
        <div class="flex justify-between text-sm font-bold text-slate-900 pt-2 border-t border-slate-200">
          <span>Net Billable:</span>
          <span id="bill-net-total" class="text-blue-700">₹0.00</span>
        </div>

        <!-- Payment Tender Section -->
        <div class="pt-2 border-t border-slate-200 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Amount Paid</label>
              <input type="number" id="payment-amount" min="0" placeholder="0.00"
                class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-emerald-700">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Tender Mode</label>
              <select id="payment-mode" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold">
                <option value="UPI">UPI / QR Code</option>
                <option value="Cash">Cash</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Credit Card">Credit Card</option>
              </select>
            </div>
          </div>

          <button onclick="submitOrderBooking()" id="book-order-btn"
            class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm text-sm transition flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Book Order & Issue Invoice
          </button>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
  let activeDeptFilter = 'All';

  function selectPatientForOrder(uhid, name) {
    AppState.activePatientUhid = uhid;
    document.getElementById('selected-patient-name').innerText = name;
    document.getElementById('selected-patient-uhid').innerText = 'UHID: ' + uhid;
    switchTab('orders');
  }

  function filterDept(dept) {
    activeDeptFilter = dept;
    document.querySelectorAll('.dept-pill').forEach(b => {
      if (b.innerText === dept) {
        b.className = 'dept-pill px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-600 text-white';
      } else {
        b.className = 'dept-pill px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200';
      }
    });
    renderCatalogCart();
  }

  function filterCatalogDisplay(term) {
    renderCatalogCart(term);
  }

  function renderCatalogCart(filterTerm = '') {
    const grid = document.getElementById('catalog-items-grid');
    if (!grid || !AppState.catalog.tests) return;

    const term = filterTerm.toLowerCase().trim();
    const items = [];

    // Add Panels
    for (const p of (AppState.catalog.panels || [])) {
      if (activeDeptFilter !== 'All' && p.department !== activeDeptFilter) continue;
      if (term && !p.name.toLowerCase().includes(term) && !p.code.toLowerCase().includes(term)) continue;
      items.push({ type: 'Panel', id: p.id, code: p.code, name: p.name, dept: p.department, price: p.price, testCount: p.testCount });
    }

    // Add Tests
    for (const t of (AppState.catalog.tests || [])) {
      if (activeDeptFilter !== 'All' && t.department !== activeDeptFilter) continue;
      if (term && !t.name.toLowerCase().includes(term) && !t.code.toLowerCase().includes(term)) continue;
      items.push({ type: 'Test', id: t.id, code: t.code, name: t.name, dept: t.department, price: t.price, units: t.units });
    }

    grid.innerHTML = items.map(item => `
      <div onclick="addToCart('${item.type}', '${item.id}')"
        class="p-3 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-lg cursor-pointer transition flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ${item.type === 'Panel' ? 'bg-purple-100 text-purple-700' : 'bg-slate-200 text-slate-700'}">${item.type}</span>
            <span class="text-xs font-mono font-bold text-slate-800">₹${item.price}</span>
          </div>
          <h4 class="text-xs font-bold text-slate-900 leading-snug">${item.name}</h4>
          <p class="text-[11px] text-slate-500">${item.dept} ${item.testCount ? '• ' + item.testCount + ' tests' : ''}</p>
        </div>
      </div>
    `).join('');
  }

  function addToCart(type, id) {
    if (AppState.cart.some(c => c.id === id)) {
      showToast('Item already in cart', 'info');
      return;
    }

    let item = null;
    if (type === 'Panel') {
      item = AppState.catalog.panels.find(p => p.id === id);
    } else {
      item = AppState.catalog.tests.find(t => t.id === id);
    }

    if (!item) return;
    AppState.cart.push({ type: type, id: item.id, code: item.code, name: item.name, price: item.price });
    renderCartList();
  }

  function removeFromCart(id) {
    AppState.cart = AppState.cart.filter(c => c.id !== id);
    renderCartList();
  }

  function renderCartList() {
    const container = document.getElementById('cart-items-container');
    const countBadge = document.getElementById('cart-item-count');
    if (countBadge) countBadge.innerText = `${AppState.cart.length} Items`;

    if (AppState.cart.length === 0) {
      container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">No tests added yet.<br>Select from the catalog.</div>`;
      updateCartTotals();
      return;
    }

    container.innerHTML = AppState.cart.map(c => `
      <div class="flex items-center justify-between py-2 text-xs">
        <div class="truncate pr-2">
          <div class="font-semibold text-slate-800 truncate">${c.name}</div>
          <span class="text-[10px] text-slate-400">${c.type}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-mono font-bold text-slate-900">₹${c.price}</span>
          <button onclick="removeFromCart('${c.id}')" class="text-red-500 hover:text-red-700 p-0.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      </div>
    `).join('');

    updateCartTotals();
  }

  function updateCartTotals() {
    let gross = 0;
    for (const item of AppState.cart) gross += item.price;

    const discountInput = document.getElementById('order-discount-amt');
    let discount = parseFloat(discountInput ? discountInput.value : 0) || 0;
    discount = Math.min(discount, gross);

    const net = Math.max(0, gross - discount);

    document.getElementById('bill-gross-total').innerText = '₹' + gross.toFixed(2);
    document.getElementById('bill-discount-total').innerText = '-₹' + discount.toFixed(2);
    document.getElementById('bill-net-total').innerText = '₹' + net.toFixed(2);

    const paymentInput = document.getElementById('payment-amount');
    if (paymentInput && (!paymentInput.value || paymentInput.value === '0')) {
      paymentInput.value = net; // Default to full payment
    }
  }

  function handleCentreChange() {
    // If centre is B2B, tariff adjusts
    updateCartTotals();
  }

  function submitOrderBooking() {
    if (!AppState.activePatientUhid) {
      showToast('Please select or register a patient first.', 'error');
      openPatientModal();
      return;
    }
    if (AppState.cart.length === 0) {
      showToast('Please add at least one test or panel to the cart.', 'error');
      return;
    }

    const payload = {
      uhid: AppState.activePatientUhid,
      referring_doctor_id: document.getElementById('order-doctor-select').value,
      collection_centre_id: document.getElementById('order-centre-select').value,
      items: AppState.cart,
      discount_amount: parseFloat(document.getElementById('order-discount-amt').value) || 0,
      discount_authorized_by: document.getElementById('order-discount-auth').value,
      initial_payment: {
        amount: parseFloat(document.getElementById('payment-amount').value) || 0,
        payment_method: document.getElementById('payment-mode').value
      }
    };

    const bookBtn = document.getElementById('book-order-btn');
    bookBtn.innerText = 'Booking Order...';
    bookBtn.disabled = true;

    google.script.run
      .withSuccessHandler((res) => {
        bookBtn.innerText = 'Book Order & Issue Invoice';
        bookBtn.disabled = false;
        showToast(`Order ${res.order.order_no} booked! Invoice: ${res.invoice.invoice_no}`);

        // Automatically trigger sample generation for phlebotomist
        google.script.run.apiGenerateSamplesForOrder(res.order.id);

        // Reset Cart
        AppState.cart = [];
        renderCartList();

        // Switch to Phlebotomy Queue
        switchTab('phlebotomy');
      })
      .withFailureHandler((err) => {
        bookBtn.innerText = 'Book Order & Issue Invoice';
        bookBtn.disabled = false;
        showToast(err.message, 'error');
      })
      .apiCreateOrder(payload);
  }
</script>
